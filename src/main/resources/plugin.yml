name: SpacetimeEngine
version: '${version}'
main: io.github.emevonlou.spacetimeengine.SpacetimeEnginePlugin
api-version: '1.21'
author: emevonlou
description: Um motor original e extensível de BedWars, criado em reverência a spacetime1000, um jogador extraordinário de PvP e a inspiração por trás deste projeto.

commands:
  spacetime:
    description: Exibe informações e ferramentas de desenvolvimento do Spacetime Engine.
    usage: /spacetime [state|transition <state>]
    aliases:
      - ste

permissions:
  spacetime.admin:
    description: Permite administrar arenas do Spacetime Engine.
    default: op
